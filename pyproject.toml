[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uwb-moe"
version = "0.1.0"
description = "A Modular Mixture-of-Experts Neural Architecture for Ultra-Wideband (UWB) Indoor Localization"
readme = "README.md"
authors = [
    { name = "Mosiow" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "h5py>=3.7.0",
    "matplotlib>=3.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "jupyter>=1.0.0",
]

[project.scripts]
uwb-train = "uwb_moe.pipelines.train:main"
uwb-eval = "uwb_moe.pipelines.evaluate:main"
uwb-download = "uwb_moe.data.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
