# =====================================================================
# Synthetic / Fast Smoke Test Configuration
# =====================================================================

data:
  dataset_url: ""
  raw_data_dir: "tests/fixtures"
  processed_data_dir: "tests/fixtures"
  train_file: "synthetic_uwb.hdf5"
  test_file: "synthetic_uwb.hdf5"
  cir_length: 64
  val_split_ratio: 0.2
  batch_size: 4
  num_workers: 0
  pin_memory: false
  save_preprocessed: false

model:
  cir_length: 64
  n_anchors: 4
  embedding_dim: 8
  cnn_channels:
    - 8
    - 16
  cnn_kernel_size: 3
  pool_size: 8
  feature_dim: 32
  gate_hidden_dim: 16
  num_experts: 2
  expert_hidden_dim: 32
  position_head_hidden: 16
  output_dim: 2
  diversity_loss_coeff: 0.01

train:
  seed: 42
  epochs: 2
  learning_rate: 0.005
  weight_decay: 0.0001
  device: "cpu"
  checkpoint_dir: "outputs/synthetic_checkpoints"
  save_best_only: true
  early_stopping_patience: 3
  log_interval: 1

eval:
  checkpoint_path: "outputs/synthetic_checkpoints/best_model.pt"
  output_dir: "outputs/synthetic_eval"
  plot_histogram: true
  histogram_bins: 10
  plot_trajectories: true

logging:
  level: "DEBUG"
  log_file: "outputs/synthetic_test.log"
  verbose: true
